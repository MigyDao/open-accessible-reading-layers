name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ORL core and fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test ORL core
        run: npm test

      - name: Build reference reader
        run: npm run build --workspace @open-reading-layers/reference-reader

      - name: Build demo EPUB
        run: bash scripts/build-demo-epub.sh

      - name: Verify Readium publication ingestion
        run: bash scripts/verify-readium-demo.sh

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
        working-directory: apps/reference-reader

      - name: Run reference-reader browser E2E
        run: npm run e2e
        working-directory: apps/reference-reader

      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: apps/reference-reader/test-results/
          retention-days: 7
